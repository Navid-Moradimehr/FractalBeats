<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FractalBeats — Audio-Reactive Fractal Visualizer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="stage"></div>

  <header>
    <div class="brand"><span class="logo">🌌</span><span class="title">FractalBeats</span></div>
    <button id="screens-btn" class="btn icon" title="Choose visualization (S)">⊞</button>
    <button id="play-btn" class="btn primary" title="Play / Pause (Space)">▶ Play</button>
    <div class="transport">
      <span class="time-label" id="time-cur">0:00</span>
      <input type="range" id="seekbar" min="0" max="1000" value="0" step="1" />
      <span class="time-label" id="time-total">0:00</span>
      <span class="track-name" id="track-name">No track loaded</span>
    </div>
    <div class="spacer"></div>
    <select id="source-select" class="btn" title="Audio source">
      <option value="none">Source: None</option>
      <option value="file">Source: File</option>
      <option value="mic">Source: Mic</option>
    </select>
    <input type="file" id="audio-file" accept="audio/*" hidden />
    <button id="load-btn" class="btn" title="Load audio file">🎵 Load</button>
    <button id="gui-btn" class="btn icon hide-desktop" title="Settings">⚙</button>
    <button id="fs-btn" class="btn icon hide-sm" title="Fullscreen (F)">⛶</button>
  </header>

  <div id="gui-host"></div>

  <section id="picker-overlay">
    <h1 class="picker-title">FractalBeats</h1>
    <p class="picker-sub">Pick a visual screen — switch anytime with keys 1–5 or the ⊞ button</p>
    <div class="card-grid" id="card-grid"></div>
  </section>

  <div id="drop-overlay">Drop audio file to play 🎧</div>
  <div id="toasts"></div>
  <div id="hint-bar"><kbd>Space</kbd> play · <kbd>1–5</kbd> screens · <kbd>S</kbd> picker · <kbd>F</kbd> fullscreen · drop a file anywhere</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
